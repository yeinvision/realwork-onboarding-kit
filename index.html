<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealWork Onboarding Kit</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/dist/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/atom-one-dark.min.css">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d4d4;
            --primary-dark: #00a8a8;
            --primary-light: #00f0f0;
            --bg: #000000;
            --bg-secondary: #0a0a0a;
            --bg-tertiary: #1a1a1a;
            --text: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border: rgba(0, 212, 212, 0.2);
            --shadow: 0 8px 32px rgba(0, 212, 212, 0.1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #000000 0%, #0a0a0a 100%);
            border-right: 1px solid var(--border);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            padding: 30px 20px;
            z-index: 100;
        }

        .main {
            margin-left: 280px;
            flex: 1;
            background: var(--bg);
        }

        .logo-section {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .logo img {
            height: 45px;
            width: auto;
            filter: brightness(1.1) drop-shadow(0 0 8px rgba(0, 212, 212, 0.3));
        }

        .logo-text {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-item {
            padding: 13px 14px;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 15px;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border-left: 3px solid transparent;
            font-family: inherit;
            font-weight: 500;
        }

        .nav-item:hover {
            background: rgba(0, 212, 212, 0.08);
            color: var(--primary);
            border-left-color: var(--primary);
            transform: translateX(4px);
        }

        .nav-item.active {
            background: rgba(0, 212, 212, 0.15);
            color: var(--primary);
            border-left-color: var(--primary);
            box-shadow: inset 4px 0 12px rgba(0, 212, 212, 0.1);
        }

        .header {
            background: linear-gradient(135deg, rgba(0, 212, 212, 0.05) 0%, transparent 100%);
            border-bottom: 1px solid var(--border);
            padding: 60px 50px;
            text-align: center;
        }

        .header h1 {
            font-size: 3em;
            color: var(--primary);
            margin-bottom: 12px;
            text-shadow: 0 0 30px rgba(0, 212, 212, 0.2);
            font-weight: 700;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 1.1em;
            color: var(--text-secondary);
        }

        .content {
            padding: 50px 50px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .content-box {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        #content h1 {
            font-size: 2.5em;
            color: var(--primary);
            margin: 50px 0 25px 0;
            border-bottom: 2px solid rgba(0, 212, 212, 0.3);
            padding-bottom: 15px;
            text-shadow: 0 0 15px rgba(0, 212, 212, 0.15);
            font-weight: 700;
        }

        #content h2 {
            font-size: 2em;
            color: var(--primary-light);
            margin: 40px 0 20px 0;
            border-left: 4px solid var(--primary);
            padding-left: 20px;
            font-weight: 700;
        }

        #content h3 {
            font-size: 1.6em;
            color: #00e5e5;
            margin: 28px 0 15px 0;
            font-weight: 600;
        }

        #content h4 {
            font-size: 1.3em;
            color: #00f0f0;
            margin: 20px 0 12px 0;
            font-weight: 600;
        }

        #content h5 {
            font-size: 1.1em;
            color: var(--primary);
            margin: 15px 0 10px 0;
            font-weight: 600;
        }

        #content p {
            margin: 16px 0;
            color: var(--text);
            font-size: 1.05em;
            line-height: 1.8;
        }

        #content ul, #content ol {
            margin: 20px 0 20px 32px;
            font-size: 1.05em;
        }

        #content li {
            margin: 10px 0;
            color: var(--text);
            line-height: 1.8;
        }

        #content ul li:before {
            content: "▸ ";
            color: var(--primary);
            font-weight: bold;
            margin-right: 8px;
        }

        #content strong {
            color: var(--primary-light);
            font-weight: 700;
        }

        #content em {
            color: #00e5e5;
            font-style: italic;
        }

        #content code {
            background: rgba(0, 212, 212, 0.12);
            padding: 4px 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            color: #00f0f0;
            border: 1px solid rgba(0, 212, 212, 0.25);
            font-size: 0.95em;
            font-weight: 500;
        }

        #content pre {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 25px 0;
            border: 1px solid rgba(0, 212, 212, 0.2);
            line-height: 1.5;
        }

        #content pre code {
            background: none;
            padding: 0;
            border: none;
            color: #a0e0e0;
            font-size: 0.95em;
        }

        #content blockquote {
            border-left: 4px solid var(--primary);
            background: rgba(0, 212, 212, 0.08);
            margin: 25px 0;
            padding: 20px 25px;
            border-radius: 6px;
            color: var(--text-secondary);
            font-style: italic;
        }

        #content table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            background: rgba(0, 212, 212, 0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        #content table thead {
            background: rgba(0, 212, 212, 0.12);
        }

        #content table th {
            color: var(--primary-light);
            padding: 16px;
            text-align: left;
            font-weight: 700;
            border-bottom: 2px solid rgba(0, 212, 212, 0.3);
        }

        #content table td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(0, 212, 212, 0.15);
            color: var(--text);
        }

        #content table tr:hover {
            background: rgba(0, 212, 212, 0.08);
        }

        #content a {
            color: var(--primary-light);
            text-decoration: none;
            border-bottom: 2px solid rgba(0, 212, 212, 0.4);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        #content a:hover {
            color: var(--primary);
            border-bottom-color: var(--primary);
            text-decoration: none;
        }

        #content hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            margin: 40px 0;
        }

        .loading {
            text-align: center;
            padding: 80px 40px;
            color: var(--primary);
            font-size: 1.1em;
        }

        .error {
            background: rgba(255, 80, 80, 0.12);
            border: 1px solid rgba(255, 80, 80, 0.3);
            border-radius: 8px;
            color: #ff6464;
            padding: 25px;
            margin: 25px 0;
            line-height: 1.6;
        }

        .error strong {
            color: #ff8080;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 212, 212, 0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 212, 0.25);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 212, 0.5);
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border);
                padding: 20px;
            }

            .main {
                margin-left: 0;
            }

            .header {
                padding: 40px 20px;
            }

            .header h1 {
                font-size: 2.2em;
            }

            .content {
                padding: 30px 20px;
            }

            .content-box {
                padding: 25px;
            }

            .nav-menu {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
            }

            .nav-item {
                flex: 1;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo-section">
                <div class="logo">
                    <img src="logo.png" alt="RealWork Logo">
                </div>
                <div class="logo-text">Onboarding Kit</div>
            </div>
            <div class="nav-menu" id="navMenu"></div>
        </div>

        <div class="main">
            <div class="header">
                <h1>RealWork Onboarding Kit</h1>
                <p>Self-guided learning platform for new members</p>
            </div>

            <div class="content">
                <div class="content-box">
                    <div id="content" class="loading">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const files = [
            { name: 'README', path: '00_START_HERE.txt' },
            { name: '1. Stage 1', path: 'Stage1_Basic_Understanding.txt' },
            { name: '2. Stage 2', path: 'Stage2_Company_Cases_Culture.txt' },
            { name: '3. Stage 3', path: 'Stage3_Workshop_SOP_Learning.txt' },
            { name: 'FAQ', path: 'FAQ_30Questions.txt' },
            { name: 'Team', path: 'Team_Members_Introduction.txt' },
            { name: 'Terms', path: 'Glossary_RealWork_Terms.txt' },
            { name: 'Cases', path: 'Project_Case_Study_Practice.txt' },
            { name: 'Mentor', path: 'Mentor_Onboarding_Preparation.txt' },
        ];

        let currentFile = '00_START_HERE.txt';

        const navMenu = document.getElementById('navMenu');
        files.forEach((file, idx) => {
            const btn = document.createElement('button');
            btn.className = 'nav-item';
            if (file.path === currentFile) btn.classList.add('active');
            btn.textContent = file.name;
            btn.onclick = () => loadFile(file.path, btn);
            navMenu.appendChild(btn);
        });

        async function loadFile(path, btn) {
            try {
                document.getElementById('content').innerHTML = '<div class="loading">Loading...</div>';
                
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentFile = path;

                const response = await fetch(path);
                if (!response.ok) throw new Error(`File not found (${response.status}): ${path}`);

                const text = await response.text();
                if (!text || text.trim() === '') throw new Error(`File is empty: ${path}`);

                const html = marked.parse(text);
                document.getElementById('content').innerHTML = html;

                document.querySelectorAll('pre code').forEach(block => {
                    try {
                        hljs.highlightElement(block);
                    } catch (e) {
                        console.log('Highlight error:', e);
                    }
                });

                document.querySelector('.main').scrollTop = 0;

            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <strong>Error loading file</strong><br/>
                        ${error.message}<br/><br/>
                        <small>Path: ${path}</small>
                    </div>
                `;
            }
        }

        window.addEventListener('load', () => {
            const firstBtn = document.querySelector('.nav-item');
            if (firstBtn) loadFile('00_START_HERE.txt', firstBtn);
        });
    </script>
</body>
</html>
