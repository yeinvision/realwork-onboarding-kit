<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealWork 생존 온보딩 키트</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/dist/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/atom-one-dark.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #e0e0e0;
            background: #0f0f0f;
            display: flex;
            min-height: 100vh;
        }
        
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            padding: 30px 20px;
            border-right: 1px solid #00d4d4;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-shadow: inset -2px 0 8px rgba(0, 212, 212, 0.1);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(0, 212, 212, 0.3);
        }
        
        .logo-text {
            font-size: 1.8em;
            font-weight: bold;
            color: #00d4d4;
            text-shadow: 0 0 15px rgba(0, 212, 212, 0.4);
            letter-spacing: -0.5px;
        }
        
        .logo img {
            height: 50px;
            width: auto;
            filter: brightness(1.1);
        }
        
        .nav-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .nav-item {
            padding: 12px 16px;
            background: transparent;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #a0a0a0;
            text-align: left;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        
        .nav-item:hover {
            background: rgba(0, 212, 212, 0.1);
            color: #00d4d4;
            border-left-color: #00d4d4;
        }
        
        .nav-item.active {
            background: rgba(0, 212, 212, 0.2);
            color: #00d4d4;
            border-left-color: #00d4d4;
            box-shadow: inset 4px 0 8px rgba(0, 212, 212, 0.2);
            font-weight: 600;
        }
        
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 40px 50px;
            overflow-y: auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 2px solid rgba(0, 212, 212, 0.3);
        }
        
        .header h1 {
            font-size: 2.5em;
            color: #00d4d4;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(0, 212, 212, 0.3);
        }
        
        .header p {
            color: #a0a0a0;
            font-size: 1em;
        }
        
        .content-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        #content {
            line-height: 1.9;
            color: #d0d0d0;
        }
        
        #content h1 { 
            font-size: 2.2em; 
            margin: 40px 0 20px 0; 
            color: #00d4d4;
            border-bottom: 2px solid rgba(0, 212, 212, 0.5);
            padding-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 212, 212, 0.2);
        }
        
        #content h2 { 
            font-size: 1.7em; 
            margin: 30px 0 15px 0; 
            color: #00e5e5;
            border-left: 4px solid #00d4d4;
            padding-left: 15px;
        }
        
        #content h3 { 
            font-size: 1.3em; 
            margin: 20px 0 12px 0; 
            color: #00f0f0;
        }
        
        #content h4 { 
            font-size: 1.1em; 
            margin: 15px 0 10px 0;
            color: #00e5e5;
        }
        
        #content p { 
            margin: 15px 0;
            color: #d0d0d0;
        }
        
        #content ul, #content ol { 
            margin: 15px 0 15px 30px;
        }
        
        #content li { 
            margin: 8px 0;
            color: #d0d0d0;
        }
        
        #content code { 
            background: rgba(0, 212, 212, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #00f0f0;
            border: 1px solid rgba(0, 212, 212, 0.3);
        }
        
        #content pre { 
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 20px 0;
            border: 1px solid rgba(0, 212, 212, 0.2);
        }
        
        #content pre code { 
            background: none;
            padding: 0;
            border: none;
            color: #00f0f0;
        }
        
        #content blockquote { 
            border-left: 4px solid #00d4d4;
            margin: 20px 0;
            padding: 15px 20px;
            color: #a0a0a0;
            background: rgba(0, 212, 212, 0.05);
            border-radius: 4px;
        }
        
        #content table { 
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
        }
        
        #content table td, #content table th { 
            border: 1px solid rgba(0, 212, 212, 0.3);
            padding: 12px;
            text-align: left;
        }
        
        #content table th { 
            background: rgba(0, 212, 212, 0.15);
            font-weight: bold;
            color: #00f0f0;
        }
        
        #content table tr:hover {
            background: rgba(0, 212, 212, 0.05);
        }
        
        #content a { 
            color: #00e5e5;
            text-decoration: none;
            border-bottom: 1px dotted rgba(0, 212, 212, 0.5);
            transition: all 0.3s ease;
        }
        
        #content a:hover { 
            color: #00d4d4;
            border-bottom-color: #00d4d4;
        }
        
        .loading {
            text-align: center;
            color: #00d4d4;
            padding: 60px 20px;
            font-size: 1.1em;
        }
        
        .error {
            background: rgba(255, 100, 100, 0.1);
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: #ff6464;
            padding: 20px;
            border-radius: 6px;
            margin: 20px 0;
        }
        
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 212, 212, 0.05);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 212, 0.3);
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 212, 0.5);
        }
        
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid #00d4d4;
                padding: 20px;
            }
            
            .main-content {
                margin-left: 0;
                padding: 30px 20px;
            }
            
            .nav-items {
                flex-direction: row;
                flex-wrap: wrap;
            }
            
            .nav-item {
                flex: 1;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="RealWork Logo">
            <div class="logo-text">생존 키트</div>
        </div>
        <div class="nav-items" id="navButtons"></div>
    </div>
    
    <div class="main-content">
        <div class="header">
            <h1>🚀 생존 온보딩 키트</h1>
            <p>신입을 위한 자기주도 학습 플랫폼</p>
        </div>
        
        <div class="content-container">
            <div id="content" class="loading">로딩 중...</div>
        </div>
    </div>

    <script>
        // 파일 목록
        const files = [
            { name: '📖 README', path: 'README.md' },
            { name: '1️⃣ 1단계', path: 'Stage1_Basic_Understanding.md' },
            { name: '2️⃣ 2단계', path: 'Stage2_Company_Cases_Culture.md' },
            { name: '3️⃣ 3단계', path: 'Stage3_Workshop_SOP_Learning.md' },
            { name: '❓ FAQ', path: 'FAQ_30Questions.md' },
            { name: '👥 팀 소개', path: 'Team_Members_Introduction.md' },
            { name: '📚 용어사전', path: 'Glossary_RealWork_Terms.md' },
            { name: '📊 프로젝트', path: 'Project_Case_Study_Practice.md' },
            { name: '🎓 사수준비', path: 'Mentor_Onboarding_Preparation.md' },
        ];
        
        let currentFile = 'README.md';
        
        // 네비게이션 버튼 생성
        const navButtons = document.getElementById('navButtons');
        files.forEach((file, idx) => {
            const btn = document.createElement('button');
            btn.className = 'nav-item';
            btn.textContent = file.name;
            btn.onclick = () => loadFile(file.path, btn);
            if (file.path === currentFile) btn.classList.add('active');
            navButtons.appendChild(btn);
        });
        
        // 파일 로드 및 렌더링
        async function loadFile(path, btn) {
            try {
                document.getElementById('content').innerHTML = '<div class="loading">⏳ 로딩 중...</div>';
                
                // 모든 버튼에서 active 제거
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentFile = path;
                
                // fetch with better error handling
                const response = await fetch(path, {
                    headers: {
                        'Accept': 'text/markdown, text/plain'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`파일을 찾을 수 없습니다 (${response.status}): ${path}`);
                }
                
                const markdown = await response.text();
                
                if (!markdown || markdown.trim() === '') {
                    throw new Error(`파일이 비어있습니다: ${path}`);
                }
                
                const html = marked.parse(markdown);
                document.getElementById('content').innerHTML = html;
                
                // 코드 하이라이팅
                document.querySelectorAll('pre code').forEach(block => {
                    try {
                        hljs.highlightElement(block);
                    } catch (e) {
                        console.log('Highlight error:', e);
                    }
                });
                
                // 페이지 상단으로 이동
                document.querySelector('.main-content').scrollTop = 0;
            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <strong>❌ 파일 로드 실패</strong><br/>
                        ${error.message}<br/><br/>
                        <small>경로: ${path}</small>
                    </div>
                `;
            }
        }
        
        // 초기 파일 로드
        window.addEventListener('load', () => {
            const firstBtn = document.querySelector('.nav-item');
            if (firstBtn) {
                loadFile('README.md', firstBtn);
            }
        });
    </script>
</body>
</html>
